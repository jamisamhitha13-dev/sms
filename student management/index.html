<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 24px 6%;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #dbeafe;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .stat-card p {
            color: #64748b;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            color: #2563eb;
            font-size: 30px;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .field input,
        .field select,
        .search {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .field input:focus,
        .field select:focus,
        .search:focus {
            border-color: #2563eb;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .edit {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
        }

        button:hover {
            opacity: 0.85;
        }

        .table-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search {
            max-width: 320px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1d4ed8;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            header {
                padding: 22px 5%;
            }

            .container {
                width: 94%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 18px;
            }

            .table-top {
                align-items: stretch;
            }

            .search {
                max-width: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage student records easily and efficiently.</p>
</header>

<main class="container">

    <section class="stats">
        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <p>Departments</p>
            <h2 id="totalDepartments">0</h2>
        </div>

        <div class="stat-card">
            <p>Average Marks</p>
            <h2 id="averageMarks">0</h2>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">
            <div class="form-grid">

                <div class="field">
                    <label for="roll">Roll Number</label>
                    <input id="roll" type="text"
                           placeholder="e.g. 101" required>
                </div>

                <div class="field">
                    <label for="name">Full Name</label>
                    <input id="name" type="text"
                           placeholder="Enter student name"
                           required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email" type="email"
                           placeholder="student@example.com"
                           required>
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select course</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="IT">IT</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                    </select>
                </div>

                <div class="field">
                    <label for="year">Year of Study</label>
                    <select id="year" required>
                        <option value="">Select year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="field">
                    <label for="marks">Marks (0–100)</label>
                    <input id="marks" type="number"
                           min="0" max="100" step="0.01"
                           placeholder="Enter marks" required>
                </div>

            </div>

            <div class="actions">
                <button class="primary" type="submit"
                        id="submitButton">Add Student</button>

                <button class="secondary" type="button"
                        id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </div>
        </form>
    </section>

    <section class="panel">
        <div class="table-top">
            <h2>Student Records</h2>
            <input class="search" id="search"
                   type="search"
                   placeholder="Search name or roll number...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    Student Management System | Built with HTML, CSS and JavaScript
</footer>

<script>
    const form = document.getElementById("studentForm");
    const table = document.getElementById("studentTable");
    const search = document.getElementById("search");

    const fields = {
        roll: document.getElementById("roll"),
        name: document.getElementById("name"),
        email: document.getElementById("email"),
        course: document.getElementById("course"),
        year: document.getElementById("year"),
        marks: document.getElementById("marks")
    };

    let students = [];

    // Load saved student records
    try {
        const saved = JSON.parse(
            localStorage.getItem("studentRecords") || "[]"
        );

        if (Array.isArray(saved)) {
            students = saved.filter(student =>
                student &&
                typeof student.roll === "string" &&
                typeof student.name === "string" &&
                typeof student.email === "string" &&
                typeof student.course === "string" &&
                typeof student.year === "string" &&
                Number.isFinite(Number(student.marks))
            );
        }
    } catch (error) {
        students = [];
    }

    let editingRoll = null;

    function saveStudents() {
        try {
            localStorage.setItem(
                "studentRecords",
                JSON.stringify(students)
            );
            return true;
        } catch (error) {
            alert("Unable to save records in this browser.");
            return false;
        }
    }

    function updateStats() {
        document.getElementById("totalStudents").textContent =
            students.length;

        const departments = new Set(
            students.map(student => student.course)
        );

        document.getElementById("totalDepartments").textContent =
            departments.size;

        const average = students.length
            ? students.reduce(
                (sum, student) => sum + Number(student.marks), 0
              ) / students.length
            : 0;

        document.getElementById("averageMarks").textContent =
            average.toFixed(1);
    }

    function createCell(value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        return cell;
    }

    function renderStudents() {
        table.replaceChildren();

        const keyword = search.value.trim().toLowerCase();

        const filtered = students.filter(student =>
            student.name.toLowerCase().includes(keyword) ||
            student.roll.toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 7;
            cell.className = "empty";
            cell.textContent = students.length
                ? "No matching students found."
                : "No students added yet. Add your first student above.";

            row.appendChild(cell);
            table.appendChild(row);
        }

        filtered.forEach(student => {
            const row = document.createElement("tr");

            row.appendChild(createCell(student.roll));
            row.appendChild(createCell(student.name));
            row.appendChild(createCell(student.email));
            row.appendChild(createCell(student.course));
            row.appendChild(createCell(student.year));

            const marksCell = createCell(student.marks);
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = Number(student.marks) >= 40
                ? "Pass"
                : "Below 40";
            marksCell.appendChild(
                document.createTextNode(" ")
            );
            marksCell.appendChild(badge);
            row.appendChild(marksCell);

            const actionsCell = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.className = "edit";
            editButton.textContent = "Edit";
            editButton.type = "button";
            editButton.addEventListener("click", () => {
                editStudent(student.roll);
            });

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete";
            deleteButton.textContent = "Delete";
            deleteButton.type = "button";
            deleteButton.style.marginLeft = "6px";
            deleteButton.addEventListener("click", () => {
                deleteStudent(student.roll);
            });

            actionsCell.append(editButton, deleteButton);
            row.appendChild(actionsCell);
            table.appendChild(row);
        });

        updateStats();
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const student = {
            roll: fields.roll.value.trim(),
            name: fields.name.value.trim(),
            email: fields.email.value.trim(),
            course: fields.course.value,
            year: fields.year.value,
            marks: Number(fields.marks.value)
        };

        if (!student.roll || !student.name || !student.email) {
            alert("Please fill in all required fields.");
            return;
        }

        if (!Number.isFinite(student.marks) ||
            student.marks < 0 || student.marks > 100) {
            alert("Marks must be between 0 and 100.");
            return;
        }

        const duplicate = students.some(existing =>
            existing.roll.toLowerCase() ===
                student.roll.toLowerCase() &&
            existing.roll !== editingRoll
        );

        if (duplicate) {
            alert("This roll number already exists.");
            return;
        }

        const previousStudents = [...students];

        if (editingRoll !== null) {
            students = students.map(existing =>
                existing.roll === editingRoll ? student : existing
            );
        } else {
            students.push(student);
        }

        if (!saveStudents()) {
            students = previousStudents;
            return;
        }

        resetForm();
        renderStudents();

        alert(editingRoll === null
            ? "Student added successfully!"
            : "Student updated successfully!");
    });

    function editStudent(roll) {
        const student = students.find(item => item.roll === roll);

        if (!student) return;

        editingRoll = roll;

        Object.keys(fields).forEach(key => {
            fields[key].value = student[key];
        });

        document.getElementById("formTitle").textContent =
            "Edit Student Details";

        document.getElementById("submitButton").textContent =
            "Update Student";

        document.getElementById("cancelButton").hidden = false;

        document.getElementById("formTitle").scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }

    function deleteStudent(roll) {
        const student = students.find(item => item.roll === roll);

        if (!student) return;

        if (!confirm("Delete student " + student.name + "?")) {
            return;
        }

        const previousStudents = [...students];
